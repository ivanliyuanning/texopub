<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据能力申请 · TexoPub</title><style>body{max-width:1000px;margin:36px auto;padding:0 24px;background:#faf8f3;color:#24372e;font:15px/1.7 system-ui}h1{font-size:28px}a{color:#245b44}button,select,textarea{font:inherit;padding:8px;border:1px solid #ccd5ca;border-radius:7px}button{background:#245b44;color:white;cursor:pointer}article{background:white;padding:22px;border:1px solid #e0dfd5;border-radius:12px;margin:16px 0}p{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#6d776d}textarea{width:95%;height:60px}#status{color:#8c4f2e}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}</style><a href="/space/settings/">← 返回设置</a><h1>数据能力申请</h1><p id="summary"></p><p id="notification"></p><p>申请信息仅供管理员处理。标记已处理不会自动开通账号的数据权限。</p><select id="filter" aria-label="申请状态"><option value="pending">待处理</option><option value="handled">已处理</option><option value="all">全部</option></select> <button id="refresh">刷新</button><p id="status" role="status"></p><p id="reauth" hidden><a href="/login/?next=%2Fapi%2Fv1%2Fdata-applications%2Fadmin%2F">重新验证后继续处理</a></p><div id="list"></div><button id="more" hidden>加载更多</button><script>
(()=>{const base='/api/v1/data-applications',list=document.getElementById('list'),message=document.getElementById('status');let cursor=null;const el=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n;};async function api(path,b){const r=await fetch(base+path,{method:b?'POST':'GET',credentials:'same-origin',headers:{'Content-Type':'application/json','X-TexoPub-Request':'space'},body:b?JSON.stringify(b):undefined}),v=await r.json();if(!r.ok){if(r.status===401)document.getElementById('reauth').hidden=false;throw Error(v.error?.message||v.error||'请求失败');}return v;}async function load(more=false){try{const result=await api('/admin?status='+document.getElementById('filter').value+(more&&cursor?'&before='+encodeURIComponent(cursor):''));if(!more)list.replaceChildren();document.getElementById('summary').textContent='待处理：'+result.pending.n+' 条';document.getElementById('notification').textContent=result.notification.configured?'邮件提醒已配置：'+result.notification.recipient:'邮件提醒尚未配置，申请仍会正常保存。';for(const r of result.items){const card=el('article','');card.append(el('h2',r.name),el('small',r.id+' · '+new Date(r.created*1000).toLocaleString()),el('p',r.purpose));if(r.last_note)card.append(el('p','最近处理备注：'+r.last_note));if(r.site_url){const link=el('a',r.site_url);link.href=r.site_url;link.target='_blank';link.rel='noopener noreferrer';card.append(link);}if(r.contact_email)card.append(el('p','申请人提供的联系邮箱：'+r.contact_email));card.append(el('p',r.mail.sent_at?'邮件已提交发送服务':'邮件待发送 / 重试中（'+r.mail.attempts+' 次尝试）'));const note=el('textarea','');note.maxLength=300;note.placeholder='处理备注（仅管理员记录）';note.setAttribute('aria-label','处理备注');card.append(note);const actions=el('div','');actions.className='actions';const mark=el('button',r.status==='pending'?'标记已处理':'恢复待处理');mark.onclick=async()=>{try{await api('/admin/'+r.id+'/status',{status:r.status==='pending'?'handled':'pending',expected_revision:r.revision,note:note.value});await load();}catch(e){message.textContent=e.message;}};actions.append(mark);if(!r.mail.sent_at){const retry=el('button','重试提醒邮件');retry.onclick=async()=>{try{await api('/admin/'+r.id+'/retry',{});message.textContent='已安排重试，请稍后刷新。';}catch(e){message.textContent=e.message;}};actions.append(retry);}card.append(actions);list.append(card);}if(!result.items.length&&!more)list.textContent='暂无申请。';cursor=result.next_cursor;document.getElementById('more').hidden=!cursor;}catch(e){message.textContent=e.message;}}document.getElementById('refresh').onclick=()=>load();document.getElementById('filter').onchange=()=>load();document.getElementById('more').onclick=()=>load(true);load();})();
</script></html>
