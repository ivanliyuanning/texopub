<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通用数据 · 交互预览</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#24372e;font:16px/1.65 system-ui}.wrap{max-width:800px;margin:auto;padding:44px 24px}h1{font-size:38px;margin:0 0 14px;letter-spacing:-1px}.tag{color:#6c7b6d;font-size:12px;letter-spacing:2px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 14px}button,input{font:inherit;border-radius:8px;border:1px solid #ccd5ca;padding:9px 14px}button{background:white;color:#245b44;cursor:pointer}button.active,button.primary{background:#245b44;color:white}button:disabled{opacity:.65;cursor:wait}#status:not(:empty){padding:12px 14px;border:1px solid #d7c49d;border-radius:8px;background:#fff8e9}form{display:flex;gap:8px;padding:18px 0}input{flex:1;min-width:100px}article{border-top:1px solid #d6dace;padding:16px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}article .actions{display:flex;gap:5px;flex-wrap:wrap}article button{font-size:12px;padding:5px 9px}.done{text-decoration:line-through;color:#7e887e}#status{color:#85613f;white-space:pre-wrap}small{color:#778474}#history{background:white;border-radius:12px;padding:16px;white-space:pre-wrap}a{color:#245b44}</style></head><body><div class="wrap"><p class="tag">TEXOPUB · DATA PREVIEW</p><h1>网页拥有可以延续的数据。</h1><p>从一条记录到一个小应用。刷新页面、换台设备，数据仍在。</p><button id="connect" class="primary">连接我的账号</button><div class="tabs"><button data-col="notes" class="active">仅作者</button><button data-col="shared">公开可读</button><button data-col="personal">访客各自读写</button></div><p id="mode">仅作品作者可读写。需要连接作者账号。</p><p id="status" role="status" aria-live="polite"></p><form id="new"><input id="title" required maxlength="100" placeholder="输入一条示例记录" aria-label="记录内容"><button class="primary">新增</button></form><button id="refresh">刷新记录</button><div id="list"></div><div id="history" hidden></div><p><small>此页仅含虚构数据。访客各自读写会隔离其他访客；作品作者及其获授权 AI 可管理全部记录。浏览器刷新后需重新连接；本地预览可直接选择虚构演示身份。</small></p></div><script src="{{SDK}}"></script><script>
(()=>{let current='notes',rows=[],busy=false,pending=null;const status=document.getElementById('status'),list=document.getElementById('list'),col=()=>TexoPubData.collection(current);const tell=x=>status.textContent=x;const el=(t,text)=>{const x=document.createElement(t);x.textContent=text;return x;};
async function run(fn){try{await fn();}catch(e){tell(e.message);}}async function load(){const r=await col().query({limit:20});rows=r.records;list.replaceChildren();for(const row of rows){const a=el('article',''),text=el('span',row.data.title);if(row.data.done)text.className='done';a.append(text);const actions=el('div','');actions.className='actions';const done=el('button',row.data.done?'撤销完成':'完成');done.onclick=()=>run(async()=>{await col().update(row.id,{...row.data,done:!row.data.done},row.revision);await load();});const history=el('button','历史');history.onclick=()=>run(async()=>{const result=await col().history(row.id),box=document.getElementById('history');box.hidden=false;box.replaceChildren(el('p','历史版本 · '+row.data.title));for(const h of result.history){const p=el('p','版本 '+h.revision+'：'+h.data.title+' '),restore=el('button','恢复');restore.onclick=()=>run(async()=>{await col().restore(row.id,h.revision,row.revision);box.hidden=true;await load();});p.append(restore);box.append(p);}if(!result.history.length)box.append(el('p','暂无历史。修改后最多保留5版、7天。'));});const del=el('button','删除');del.onclick=()=>run(async()=>{await col().remove(row.id,row.revision);await load();});actions.append(done,history,del);a.append(actions);list.append(a);}tell(r.records.length?'已从数据接口读取 '+r.records.length+' 条':'还没有记录，可以添加第一条。');}
const input=document.getElementById('title'),form=document.getElementById('new'),submit=form.querySelector('button');const newKey=()=>typeof crypto.randomUUID==='function'?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),v=>v.toString(16).padStart(2,'0')).join('');
input.addEventListener('invalid',()=>tell('请先填写一条记录，再点击新增。'));
document.getElementById('connect').onclick=()=>run(async()=>{tell('请在平台连接窗口中确认身份，输入内容会保留。');await TexoPubData.connect();tell('已连接');await load();});
form.onsubmit=async e=>{e.preventDefault();if(busy)return;const title=input.value.trim();if(!title){tell('请先填写一条记录，再点击新增。');input.focus();return;}if(!pending||pending.collection!==current||pending.data.title!==title)pending={collection:current,data:{title,done:false},key:newKey()};const request=pending,records=TexoPubData.collection(request.collection);busy=true;submit.disabled=true;submit.textContent='正在保存…';tell('正在新增记录…');
try{let result;try{result=await records.create(request.data,request.key);}catch(error){if(!['connect_required','grant_expired','account_authentication','disconnected'].includes(error.code))throw error;submit.textContent='等待连接…';tell('需要先连接账号。请在平台连接窗口中确认，之后会自动新增；输入内容已保留。');await TexoPubData.connect();submit.textContent='正在保存…';result=await records.create(request.data,request.key);}if(input.value.trim()===request.data.title)input.value='';pending=null;await load();tell('已新增「'+result.record.data.title+'」，并保存到数据库。');}catch(error){tell(error.code==='connect_cancelled'?'尚未新增，输入内容已保留。点击新增可重新连接。':error.message);}finally{busy=false;submit.disabled=false;submit.textContent='新增';}};
document.getElementById('refresh').onclick=()=>run(load);for(const b of document.querySelectorAll('[data-col]'))b.onclick=()=>{current=b.dataset.col;for(const x of document.querySelectorAll('[data-col]'))x.classList.toggle('active',x===b);document.getElementById('mode').textContent={notes:'仅作品作者可读写。需要连接作者账号。',shared:'无需连接即可读。仅作品作者可以写入。',personal:'登录后读写自己的记录，其他访客不可见；作者及授权AI可管理全部记录。'}[current];document.getElementById('history').hidden=true;list.replaceChildren();run(load);};})();
</script></body></html>
