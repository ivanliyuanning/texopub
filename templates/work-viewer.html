<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>{{TITLE}}</title><link rel="icon" href="{{ICON}}"><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{--bar:calc(48px + env(safe-area-inset-top,0px));background:#faf8f3;color:#222b28;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}header{position:fixed;inset:0 0 auto;height:var(--bar);padding-top:env(safe-area-inset-top,0px);display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;border-bottom:1px solid #e4e1da;background:#faf8f3;z-index:2;transform:translateY(0);transition:transform .18s ease}a.home{display:grid;place-items:center;width:44px;height:44px;margin-left:4px;border-radius:9px;color:#222b28;text-decoration:none}a.home:hover{background:#eeeae1}a.home:focus-visible,button:focus-visible{outline:2px solid #c74727;outline-offset:-3px}a.home svg{width:32px;height:32px}.work-title{margin:0;font-size:14px;font-weight:550;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}iframe{position:absolute;inset:var(--bar) 0 0;width:100%;height:calc(100% - var(--bar));border:0;background:white;transition:top .18s ease,height .18s ease}.reveal{visibility:hidden;position:fixed;top:0;left:50%;transform:translate(-50%,-100%);width:52px;height:16px;border:1px solid #ddd9d0;border-top:0;border-radius:0 0 10px 10px;background:#faf8f3;color:#626a64;z-index:3;cursor:pointer;padding:0;line-height:10px;transition:transform .18s ease}body[data-reading] header{transform:translateY(-100%);pointer-events:none}body[data-reading] iframe{top:0;height:100%}body[data-reading] .reveal{visibility:visible;transform:translate(-50%,0)}noscript{position:fixed;bottom:0;left:0;right:0;background:#faf8f3;padding:8px;text-align:center;font-size:12px}@media(prefers-reduced-motion:reduce){header,iframe,.reveal{transition:none}}@media print{header,.reveal,noscript{display:none}iframe{top:0;height:100%}}
</style></head><body><header aria-label="TexoPub 平台标题栏"><a class="home" href="https://texopub.com/" aria-label="TexoPub 首页" title="TexoPub 首页"><svg aria-hidden="true" viewBox="0 0 40 40"><path d="M5 18.5 20 5l15 13.5V34a1.5 1.5 0 0 1-1.5 1.5h-27A1.5 1.5 0 0 1 5 34Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><g fill="#C74727" transform="translate(9 12) scale(.34)"><rect x="6" y="12" width="16" height="12" rx="2.5"/><rect x="26" y="12" width="12" height="44" rx="2.5"/><rect x="42" y="12" width="16" height="12" rx="2.5"/></g></svg></a><h1 class="work-title">{{TITLE}}</h1><span aria-hidden="true"></span></header><button class="reveal" type="button" aria-label="显示 TexoPub 标题栏" aria-expanded="true">⌄</button><iframe id="texopub-work" src="{{SOURCE}}" title="作品内容" sandbox="{{SANDBOX}}"></iframe><noscript>作品标题栏保持显示。<a href="{{SOURCE}}">单独打开作品</a></noscript><script>
(()=>{'use strict';if(new URLSearchParams(location.search).get('lang')==='en'||(!new URLSearchParams(location.search).has('lang')&&!navigator.language.toLowerCase().startsWith('zh'))){document.documentElement.lang='en';const labels={'TexoPub 平台标题栏':'TexoPub platform toolbar','TexoPub 首页':'TexoPub home','显示平台标题栏':'Show platform toolbar'};document.querySelectorAll('[aria-label],[title]').forEach(node=>{for(const attr of ['aria-label','title']){const text=node.getAttribute(attr);if(labels[text])node.setAttribute(attr,labels[text]);}});} const frame=document.getElementById('texopub-work'),bar=document.querySelector('header'),title=document.querySelector('.work-title'),reveal=document.querySelector('.reveal');const config={{CONFIG}};let reading=false,lastDirection='',travel=0,pinnedUntil=0;
function show(hidden){reading=hidden;document.body.toggleAttribute('data-reading',hidden);bar.inert=hidden;bar.setAttribute('aria-hidden',String(hidden));reveal.setAttribute('aria-expanded',String(!hidden));}
reveal.addEventListener('click',()=>{pinnedUntil=Date.now()+1500;travel=0;show(false);document.querySelector('.home').focus();});
addEventListener('keydown',e=>{if(e.key==='Escape')show(false);});
addEventListener('message',e=>{const m=e.data;if(e.source!==frame.contentWindow||!m||m.type!=='texopub:work-state')return;
if(typeof m.title==='string'&&m.title.trim()){const value=m.title.trim().slice(0,240);title.textContent=value;title.title=value;document.title=value;}
if(typeof m.path==='string'&&m.path.startsWith(config.rawRoot)){const relative=m.path.slice(config.rawRoot.length);if(!relative.split('/').some(x=>x==='..')&&!/[?#\\]/.test(relative)){const file=(relative===config.entry||relative===config.entry.split('/').map(encodeURIComponent).join('/'))?'':relative;try{const target=new URL(config.publicRoot+file,location.href);target.search=typeof m.search==='string'?m.search:'';target.hash=typeof m.hash==='string'?m.hash:'';if(target.origin===location.origin&&target.pathname.startsWith(config.publicRoot))history.replaceState(null,'',target.pathname+target.search+target.hash);}catch{}}}
if(m.kind==='scroll'&&Number.isFinite(m.delta)&&Number.isFinite(m.y)){if(m.y<=8){travel=0;show(false);return;}const direction=m.delta>0?'down':'up';if(direction!==lastDirection)travel=0;lastDirection=direction;travel+=Math.abs(m.delta);if(Date.now()<pinnedUntil)return;if(direction==='down'&&m.y>56&&travel>=24)show(true);else if(direction==='up'&&travel>=16)show(false);}
});
frame.addEventListener('load',()=>{travel=0;show(false);});
try{const hash=location.hash;if(hash)frame.src=frame.getAttribute('src').split('#')[0]+hash;}catch{}
})();
</script></body></html>
