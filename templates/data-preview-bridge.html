<script data-texopub-preview-data>
(()=>{'use strict';const frame=document.getElementById('texopub-work'),config={{DATA_CONFIG}};if(!config)return;let role='author',grant=null,connectIds=[],running=0;
const names={author:'演示作者',visitor:'演示访客一',other:'演示访客二'},button=document.createElement('button');button.type='button';button.textContent='连接演示账号';button.style='position:fixed;right:12px;bottom:14px;z-index:6;padding:10px 16px;border:1px solid #ccd8ce;border-radius:20px;background:#faf8f3;color:#245b44;font:14px system-ui;cursor:pointer';document.body.append(button);
const dialog=document.createElement('dialog');dialog.style='max-width:440px;width:calc(100% - 40px);border:1px solid #ccd8ce;border-radius:16px;padding:26px;color:#24372e;background:#faf8f3;font:15px/1.7 system-ui';dialog.innerHTML='<h2 style="margin:0 0 12px;font-size:23px">连接本地演示账号</h2><p>这里只使用虚构身份，不会登录或修改你的正式账号。连接后将继续刚才的操作，输入内容会保留。</p><label>选择演示身份 <select style="font:inherit;padding:8px;width:100%;margin:8px 0 16px"><option value="author">演示作者（可操作全部示例类型）</option><option value="visitor">演示访客一（只能写自己的访客记录）</option><option value="other">演示访客二（与访客一隔离）</option></select></label><p data-message role="status"></p><div style="display:flex;gap:10px"><button data-confirm style="font:inherit;padding:10px 16px;background:#245b44;color:white;border:0;border-radius:8px">连接并继续</button><button data-cancel style="font:inherit;padding:10px 16px;border:1px solid #ccd8ce;border-radius:8px;background:white">暂不连接</button></div>';document.body.append(dialog);
const select=dialog.querySelector('select'),confirm=dialog.querySelector('[data-confirm]'),message=dialog.querySelector('[data-message]');
function reply(id,result,error){frame.contentWindow.postMessage({type:'texopub:data-response',id,result,error},'*');}
async function api(action,body={},who=role){const r=await fetch('/preview/runtime',{method:'POST',credentials:'omit',headers:{'Content-Type':'application/json','X-TexoPub-Preview':'runtime'},body:JSON.stringify({action,role:who,ticket:config.ticket,...body})}),v=await r.json();if(!r.ok)throw Object.assign(Error(v.error?.message||v.error||'演示连接失败'),{code:v.error?.code||'request_failed'});return v;}
function show(){select.value=role;message.textContent='';if(!dialog.open)dialog.showModal();confirm.disabled=false;}
function cancel(){dialog.close();for(const id of connectIds)reply(id,null,{code:'connect_cancelled',message:'尚未连接，输入内容已保留。点击新增可重新连接。'});connectIds=[];}
button.onclick=show;dialog.querySelector('[data-cancel]').onclick=cancel;dialog.addEventListener('cancel',e=>{e.preventDefault();cancel();});
confirm.onclick=async()=>{confirm.disabled=true;message.textContent='正在连接…';try{if(grant)await api('disconnect',{grant_id:grant.grant_id});const next=select.value;grant=await api('grant',{confirm:true},next);role=next;button.textContent=names[role]+' · 切换身份';dialog.close();for(const id of connectIds)reply(id,{connected:true,preview:true});connectIds=[];}catch(e){message.textContent=e.message;}finally{confirm.disabled=false;}};
addEventListener('message',async e=>{const m=e.data;if(e.source!==frame.contentWindow||m?.type!=='texopub:data-request'||typeof m.id!=='string'||m.id.length>100)return;
 if(m.operation==='connect'){if(grant){reply(m.id,{connected:true,preview:true});return;}if(connectIds.length>=3){reply(m.id,null,{code:'busy',message:'已有连接正在处理'});return;}connectIds.push(m.id);show();return;}
 if(m.operation==='disconnect'){try{if(grant)await api('disconnect',{grant_id:grant.grant_id});grant=null;button.textContent='连接演示账号';reply(m.id,{disconnected:true});}catch(e){reply(m.id,null,{code:e.code,message:e.message});}return;}
 if(!['query','get','create','update','remove','history','restore','clear_history'].includes(m.operation)||typeof m.collection!=='string'||JSON.stringify(m).length>131072||running>=3){reply(m.id,null,{code:'invalid_request',message:'请求无效或正在处理其他操作'});return;}
 running++;try{const result=await api('call',{grant_id:grant?.grant_id,operation:m.operation,collection:m.collection,args:m.args||{}});reply(m.id,result);}catch(e){if(['grant_expired','account_authentication'].includes(e.code)){grant=null;button.textContent='重新连接演示账号';}reply(m.id,null,{code:e.code,message:e.message});}finally{running--;}
});})();
</script>
