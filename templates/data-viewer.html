<script>
(()=>{'use strict';const frame=document.getElementById('texopub-work'),config={{DATA_CONFIG}};if(!config)return;let popup,port,connected=false,connectIds=[],pending=new Map(),running=0;
const bar=document.querySelector('header'),button=document.createElement('button');button.textContent='连接数据';button.type='button';button.style='position:fixed;right:12px;bottom:14px;z-index:6;padding:9px 14px;border:1px solid #ccd8ce;border-radius:20px;background:#faf8f3;color:#245b44;font:13px system-ui;cursor:pointer';button.title='通过TexoPub登录，按作品权限连接数据';document.body.append(button);
function reply(id,result,error){frame.contentWindow.postMessage({type:'texopub:data-response',id,result,error},'*');}
function reset(){port?.close();port=null;connected=false;button.textContent='连接数据';for(const [id] of pending)reply(id,null,{code:'disconnected',message:'连接已断开，请重新连接'});pending.clear();}
button.onclick=()=>{if(connected){popup?.focus();return;}popup=window.open(config.api+'/connect?ticket='+encodeURIComponent(config.ticket),'texopub-data-'+Math.random().toString(36).slice(2),'width=640,height=720');if(!popup){button.textContent='请允许弹出连接窗口';}};
addEventListener('message',async e=>{const m=e.data;if(!m)return;
 if(e.source===popup&&e.origin===config.app_origin&&m.type==='texopub:data-ready'&&m.ticket===config.ticket){const ch=new MessageChannel();port=ch.port1;port.onmessage=ev=>{const v=ev.data;if(v?.type==='connected'){connected=true;button.textContent='数据已连接';for(const id of connectIds)reply(id,{connected:true});connectIds=[];return;}if(pending.has(v?.id)){pending.delete(v.id);reply(v.id,v.result,v.error);if(['grant_expired','viewer_expired','viewer_stale'].includes(v.error?.code)){reset();try{popup?.close();}catch{}popup=null;button.textContent='重新连接数据';}}};port.start();popup.postMessage({type:'texopub:data-port',ticket:config.ticket},config.app_origin,[ch.port2]);return;}
 if(e.source!==frame.contentWindow||m.type!=='texopub:data-request'||typeof m.id!=='string'||m.id.length>100)return;
 if(m.operation==='connect'){if(connected)reply(m.id,{connected:true});else{connectIds.push(m.id);if(connectIds.length>3)reply(connectIds.shift(),null,{code:'connect_required',message:'请点击标题栏外的连接数据按钮'});button.textContent='点击连接数据';button.focus();}return;}
 if(m.operation==='disconnect'){try{popup?.close();}catch{}reset();reply(m.id,{disconnected:true});return;}
 if(!['query','get','create','update','remove','history','restore','clear_history'].includes(m.operation)||typeof m.collection!=='string'){reply(m.id,null,{code:'invalid_operation',message:'不支持的数据操作'});return;}
 if(JSON.stringify(m).length>131072||running>=3||pending.size>=3){reply(m.id,null,{code:'busy',message:'请求过大或正在处理其他请求'});return;}
 if(connected&&port&&popup&&!popup.closed){pending.set(m.id,Date.now());port.postMessage({id:m.id,operation:m.operation,collection:m.collection,args:m.args});return;}
 running++;try{const r=await fetch(config.api+'/runtime/call',{method:'POST',credentials:'omit',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticket:config.ticket,operation:m.operation,collection:m.collection,args:m.args||{}})}),result=await r.json();if(!r.ok)reply(m.id,null,result.error);else reply(m.id,result);}catch{reply(m.id,null,{code:'request_failed',message:'数据请求失败，请稍后重试'});}finally{running--;}
 });frame.addEventListener('load',()=>{reset();connectIds=[];});setInterval(()=>{if(connected&&(!popup||popup.closed))reset();for(const [id,time] of pending)if(Date.now()-time>30000){pending.delete(id);reply(id,null,{code:'timeout',message:'数据请求超时，请重试'});}},1000);
})();
</script>
