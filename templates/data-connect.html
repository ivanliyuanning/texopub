<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接作品数据 · TexoPub</title><style>body{font:16px/1.7 system-ui;margin:32px auto;padding:0 24px;max-width:580px;color:#24372e;background:#faf8f3}h1{font-size:24px}button,a{font:inherit}button{padding:10px 18px;border:0;border-radius:8px;background:#245b44;color:white;cursor:pointer}button:disabled{opacity:.5}.muted{color:#67766c}li{margin:8px 0}#status{white-space:pre-wrap}a{color:#245b44}</style><h1>连接作品数据</h1><p id="work">正在核对作品…</p><ul id="collections"></ul><p id="notice"></p><p class="muted">连接后，网页可按以上权限读写数据。管理密钥与登录凭证不会交给网页。请保持此窗口打开；关闭或30分钟未使用会断开连接。</p><button id="connect" disabled>允许连接</button> <button id="close" style="background:#67766c">关闭</button><p id="status" role="status"></p><p><a id="login" hidden>登录或重新验证</a></p><script>
(()=>{'use strict';const ticket=new URLSearchParams(location.search).get('ticket'),base='/api/v1/data',status=document.getElementById('status'),button=document.getElementById('connect');let info,grant,port;
const show=x=>status.textContent=x;async function api(path,body){const r=await fetch(base+path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-TexoPub-Request':'space'},body:JSON.stringify({ticket,...body})});const b=await r.json();if(!r.ok){const err=Error(b.error?.message||b.error||'请求失败');err.code=b.error?.code;err.status=r.status;throw err;}return b;}
function login(){const a=document.getElementById('login');a.href='/login/?next='+encodeURIComponent(location.pathname+location.search);a.hidden=false;}
async function start(){try{info=await api('/runtime/info',{});document.getElementById('work').textContent=info.title+' · '+info.author;document.getElementById('notice').textContent=info.notice;for(const [k,v] of Object.entries(info.collections)){const li=document.createElement('li');li.textContent=k+'：'+({owner:'仅作者本人',public_read:'任何人可读，作者可写',user_private:'登录访客各自读写；作者可管理全部记录'}[v.mode]);document.getElementById('collections').append(li);}if(!opener)throw Error('请从作品标题栏重新发起连接');button.disabled=false;}catch(e){show(e.message);}}
button.onclick=async()=>{button.disabled=true;try{grant=await api('/runtime/grant',{confirm:true});show('已授权，正在连接作品…');opener.postMessage({type:'texopub:data-ready',ticket},info.viewer_origin);}catch(e){show(e.message);if(e.status===401)login();button.disabled=false;}};
addEventListener('message',e=>{if(!grant||port||e.source!==opener||e.origin!==info.viewer_origin||e.data?.type!=='texopub:data-port'||e.data.ticket!==ticket||e.ports.length!==1)return;port=e.ports[0];let running=0;port.onmessage=async ev=>{const m=ev.data;if(!m||typeof m.id!=='string'||m.id.length>100||running>=3)return;running++;try{if(JSON.stringify(m).length>131072)throw Error('请求过大');const result=await api('/runtime/call',{grant_id:grant.grant_id,collection:m.collection,operation:m.operation,args:m.args||{}});port.postMessage({id:m.id,result});}catch(e){port.postMessage({id:m.id,error:{code:e.status===401?'grant_expired':e.code||'request_failed',message:e.message}});}finally{running--;}};port.start();port.postMessage({type:'connected'});show('已连接。可返回作品继续使用；此窗口保持打开。');});
async function disconnect(){if(grant)try{await api('/runtime/disconnect',{grant_id:grant.grant_id});}catch{}port?.close();close();}document.getElementById('close').onclick=disconnect;start();})();
</script></html>
