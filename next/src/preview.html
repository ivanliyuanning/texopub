<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TexoPub 整站尺寸预览</title><style>*{box-sizing:border-box}body{margin:0;background:#e9eae5;color:#f8f8f0;font:12px sans-serif}header{height:52px;background:#242d28;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:16px}nav{display:flex;gap:8px;align-items:center}button,select{font:inherit;padding:8px 12px;border:0;border-radius:4px;min-height:36px}button{cursor:pointer;background:#414c43;color:#f8f8f0}button[aria-pressed=true]{background:#dfedab;color:#25342b}select{max-width:150px}main{height:calc(100dvh - 52px);display:flex;justify-content:center;overflow:auto;padding:0}iframe{border:0;width:100%;height:100%;background:#faf9f5}main.mobile{padding:16px}main.mobile iframe{width:390px;max-width:100%;border-radius:12px;height:calc(100dvh - 84px)}main.small iframe{width:320px}@media(max-width:650px){header>span{display:none}header{padding:0 10px;gap:6px}nav{gap:4px}button,select{font-size:10px;padding:7px 9px}}</style></head><body><header><span>TexoPub 整站预览</span><select id="page" aria-label="预览页面"><option value="/">发现</option><option value="/u/preview/">个人主页</option><option value="/space/works/">我的作品</option><option value="/space/materials/">我的素材</option><option value="/publish/">交给 AI</option><option value="/space/settings/">设置</option><option value="/login/">登录</option></select><nav><button data-size="desktop" aria-pressed="true">桌面</button><button data-size="390" aria-pressed="false">390px</button><button data-size="320" aria-pressed="false">320px</button></nav></header><main id="stage"><iframe id="frame" src="/" title="TexoPub 整站响应式预览"></iframe></main><script>const stage=document.querySelector('#stage'),frame=document.querySelector('#frame'),page=document.querySelector('#page'),params=new URLSearchParams(location.search);if([...page.options].some(o=>o.value===params.get('page'))){page.value=params.get('page');frame.src=page.value}function resize(size){document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.size===size)));stage.className=size==='desktop'?'':'mobile'+(size==='320'?' small':'')}resize(['390','320'].includes(params.get('size'))?params.get('size'):'desktop');page.onchange=e=>frame.src=e.target.value;document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>resize(b.dataset.size));</script></body></html>
